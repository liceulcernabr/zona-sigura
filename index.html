<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zona Sigură Antibullying</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Onest:wght@400;500;600;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: comic-zine course hub — sticky ink nav, hash-routed views, panels with heavy ink borders + offset shadows; halftone used only on hero and comic */
:root{
  --paper:#F2F4FA; --card:#FFFFFF; --ink:#14162B; --muted:#565C7A; --line:#14162B; --soft:#E3E7F4;
  --cobalt:#2743F5; --coral:#FF5446; --sun:#FFC22E; --mint:#12A884; --lilac:#8B6CFF;
  --cobalt-ink:#FFFFFF; --sun-ink:#14162B;
  --shadow:4px 4px 0 var(--line);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Patrick Hand","Comic Sans MS","Segoe Print",cursive;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1022; --card:#191C35; --ink:#EEF0FF; --muted:#A4A9CB; --line:#B9BFF0; --soft:#24284A;
  --cobalt:#6E86FF; --coral:#FF7A6E; --sun:#FFD260; --mint:#3BD3A8; --lilac:#A893FF;
  --cobalt-ink:#0E1022; --sun-ink:#14162B; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E1022; --card:#191C35; --ink:#EEF0FF; --muted:#A4A9CB; --line:#B9BFF0; --soft:#24284A;
  --cobalt:#6E86FF; --coral:#FF7A6E; --sun:#FFD260; --mint:#3BD3A8; --lilac:#A893FF;
  --cobalt-ink:#0E1022; --sun-ink:#14162B; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--cobalt)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-display);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* NAV */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:var(--paper)}
.topbar .wrap{display:flex;align-items:center;gap:18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--paper);font-family:var(--f-display);font-weight:900;font-size:1rem;white-space:nowrap}
.brand-mark{width:34px;height:34px;flex:none}
.navscroll{overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.navscroll::-webkit-scrollbar{display:none}
.nav{display:flex;gap:4px;list-style:none;margin:0;padding:0;justify-content:flex-end;min-width:max-content}
.nav a{display:block;padding:7px 11px;border-radius:999px;color:var(--paper);text-decoration:none;font-weight:600;font-size:.88rem;white-space:nowrap;opacity:.82}
.nav a:hover{opacity:1;background:color-mix(in srgb,var(--paper) 14%,transparent)}
.nav a[aria-current="page"]{background:var(--sun);color:var(--sun-ink);opacity:1}
.progress-pill{font-family:var(--f-display);font-size:.7rem;background:var(--coral);color:#fff;padding:4px 9px;border-radius:999px;white-space:nowrap}
@media (max-width:760px){.brand span{display:none}.progress-pill{display:none}}

/* VIEWS */
.view{display:none;padding-block:28px 80px}
.view.active{display:block;animation:rise .45s ease both}
@keyframes rise{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.view.active{animation:none}*{scroll-behavior:auto!important}}

/* HERO */
.hero{position:relative;background:var(--cobalt);color:var(--cobalt-ink);border:3px solid var(--line);border-radius:22px;box-shadow:8px 8px 0 var(--line);overflow:hidden;padding:clamp(22px,4vw,46px)}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--cobalt-ink) 22%,transparent) 1.4px,transparent 1.6px);background-size:12px 12px;mask-image:linear-gradient(115deg,transparent 45%,#000 100%);-webkit-mask-image:linear-gradient(115deg,transparent 45%,#000 100%);pointer-events:none}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.25fr .9fr;gap:34px;align-items:center}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.1rem,5.6vw,4.4rem);font-weight:900;letter-spacing:-.02em;line-height:1.02}
.hero h1 .strike{position:relative;white-space:nowrap}
.hero h1 .strike::after{content:"";position:absolute;left:-4%;right:-4%;top:52%;height:.13em;background:var(--coral);transform:rotate(-3deg);border-radius:4px;animation:strike 1s .5s cubic-bezier(.7,0,.2,1) both;transform-origin:left}
@keyframes strike{from{transform:rotate(-3deg) scaleX(0)}to{transform:rotate(-3deg) scaleX(1)}}
.hero .lead{margin-top:16px;font-size:1.12rem;max-width:52ch;opacity:.95}
.hero .course-name{margin-top:18px;font-family:var(--f-display);font-weight:700;font-size:.9rem;letter-spacing:.02em;max-width:46ch;opacity:.9}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;border:2.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;text-decoration:none;box-shadow:3px 3px 0 var(--line);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.coral{background:var(--coral);color:#fff}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.small{padding:7px 12px;font-size:.88rem;border-width:2px;box-shadow:2px 2px 0 var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* phone in hero */
.phone{background:#0d0f1c;border-radius:32px;padding:12px;border:3px solid var(--line);box-shadow:6px 6px 0 var(--line);max-width:330px;margin-inline:auto;width:100%}
.phone-screen{background:#ECE5DD;border-radius:22px;overflow:hidden;color:#14162B}
.phone-head{background:#1F2C5C;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:.92rem}
.phone-head small{display:block;font-weight:400;opacity:.75;font-size:.72rem}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}
.chat{padding:12px;display:flex;flex-direction:column;gap:7px;min-height:300px}
.msg{max-width:84%;padding:7px 10px;border-radius:12px;font-size:.88rem;line-height:1.35;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.12);animation:pop .35s ease both}
.msg b{display:block;font-size:.72rem;color:#2743F5}
.msg.me{align-self:flex-end;background:#D7F7C6}
.msg.sys{align-self:center;background:#FFF4C2;font-size:.75rem;text-align:center}
.msg.bad{outline:2px solid #FF5446}
.msg .react{display:inline-block;margin-top:3px;font-size:.72rem;background:#f1f1f1;border-radius:999px;padding:0 6px}
@keyframes pop{from{transform:scale(.85) translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* stats strip */
.facts{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-top:26px;border:3px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.fact{padding:16px 18px;border-right:2px solid var(--soft)}
.fact:last-child{border-right:0}
.fact .n{font-family:var(--f-display);font-weight:900;font-size:1.6rem;font-variant-numeric:tabular-nums}
.fact .l{font-size:.82rem;color:var(--muted);line-height:1.35}
@media (max-width:900px){.facts{grid-template-columns:repeat(3,1fr)}.fact:nth-child(3){border-right:0}.fact:nth-child(-n+3){border-bottom:2px solid var(--soft)}}
@media (max-width:480px){.facts{grid-template-columns:repeat(2,1fr)}.fact{border-right:2px solid var(--soft)!important;border-bottom:2px solid var(--soft)}.fact:nth-child(2n){border-right:0!important}}

/* sections */
.section{margin-top:54px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.section-head h2{font-size:clamp(1.45rem,3vw,2.15rem);font-weight:900}
.section-head p{color:var(--muted);max-width:60ch}

/* module cards */
.modgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:1000px){.modgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.modgrid{grid-template-columns:1fr}}
.modcard{position:relative;display:flex;flex-direction:column;gap:10px;padding:20px;border:3px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s;min-width:0}
.modcard:hover{transform:translate(-2px,-3px) rotate(-.4deg);box-shadow:7px 8px 0 var(--line)}
.modcard .num{font-family:var(--f-display);font-weight:900;font-size:3rem;line-height:1;color:var(--mc)}
.modcard h3{font-size:1.02rem;font-weight:700}
.modcard .dates{font-size:.82rem;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;border:2px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--mc,var(--mint));width:0;transition:width .6s}
.hours{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px;border:2px solid var(--line);background:var(--paper);white-space:nowrap}
.chip.s{background:var(--sun);color:var(--sun-ink)}
.chip.a{background:var(--lilac);color:#fff}
.chip.t{background:var(--card)}

/* module page */
.modhero{border:3px solid var(--line);border-radius:22px;box-shadow:8px 8px 0 var(--line);padding:clamp(20px,3.5vw,38px);background:var(--mc);color:#fff;position:relative;overflow:hidden}
.modhero::after{content:attr(data-n);position:absolute;right:-10px;bottom:-50px;font-family:var(--f-display);font-weight:900;font-size:13rem;line-height:1;opacity:.16;pointer-events:none}
.modhero h1{font-size:clamp(1.6rem,4vw,2.9rem);font-weight:900;max-width:22ch;position:relative;z-index:1}
.modhero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;position:relative;z-index:1}
.modhero .meta .chip{background:#fff;color:#14162B;border-color:#14162B}
.modhero .goal{margin-top:16px;max-width:64ch;font-size:1.05rem;position:relative;z-index:1}
.sessions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;position:relative;z-index:1}
@media (max-width:700px){.sessions{grid-template-columns:1fr}}
.sess{background:rgba(255,255,255,.95);color:#14162B;border:2px solid #14162B;border-radius:12px;padding:10px 12px;font-size:.86rem}
.sess b{font-family:var(--f-display);font-size:.84rem}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 18px}
.tab{padding:8px 14px;border-radius:999px;border:2.5px solid var(--line);background:var(--card);font-weight:700;font-size:.9rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}

.ideas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.idea{border:2.5px solid var(--line);border-radius:var(--r);padding:18px;background:var(--card);min-width:0}
.idea h4{font-size:.98rem;margin-bottom:8px}
.idea p,.idea li{font-size:.94rem;color:var(--ink)}
.idea ul{margin:6px 0 0;padding-left:18px}
.idea .k{font-family:var(--f-hand);font-size:1.25rem;color:var(--coral);line-height:1.2;display:block;margin-bottom:6px}

/* generic app frame */
.app{border:3px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow);margin-top:22px;overflow:hidden}
.app-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:3px solid var(--line);background:var(--soft);flex-wrap:wrap}
.app-head .tag{font-family:var(--f-display);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:4px 8px;border-radius:6px}
.app-head h3{font-size:1.05rem;flex:1;min-width:200px}
.app-body{padding:18px}
.app-body .hint{color:var(--muted);font-size:.92rem;margin-bottom:14px}
.score{font-family:var(--f-display);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}

/* sorter */
.sorter{display:grid;grid-template-columns:1fr;gap:14px}
.sort-card{border:2.5px dashed var(--line);border-radius:14px;padding:16px;background:var(--paper);font-size:1rem;min-height:92px}
.sort-card .who{font-family:var(--f-hand);font-size:1.15rem;color:var(--cobalt)}
.sort-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.sort-btns{grid-template-columns:1fr}}
.feedback{border-radius:12px;padding:12px 14px;font-size:.94rem;border:2px solid var(--line);display:none}
.feedback.show{display:block;animation:pop .3s ease}
.feedback.ok{background:color-mix(in srgb,var(--mint) 22%,var(--card))}
.feedback.no{background:color-mix(in srgb,var(--coral) 20%,var(--card))}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.dots i.ok{background:var(--mint)}.dots i.no{background:var(--coral)}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.flip{perspective:900px;min-height:190px;border:0;background:none;padding:0;text-align:left}
.flip-in{position:relative;width:100%;height:100%;min-height:190px;transition:transform .55s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip-f,.flip-b{position:absolute;inset:0;border:2.5px solid var(--line);border-radius:14px;padding:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;gap:6px;overflow:auto}
.flip-f{background:var(--card)}
.flip-f .ic{font-size:2rem;line-height:1}
.flip-f h4{font-size:.95rem}
.flip-f small{color:var(--muted);margin-top:auto;font-size:.76rem}
.flip-b{transform:rotateY(180deg);background:var(--ink);color:var(--paper);font-size:.86rem;line-height:1.45}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}}

/* feed detective */
.feed{max-width:520px;margin-inline:auto;display:flex;flex-direction:column;gap:12px}
.post{border:2.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--paper);text-align:left;width:100%;transition:transform .12s}
.post:hover{transform:translateX(3px)}
.post .ph{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.post .ph small{font-weight:400;color:var(--muted)}
.post p{margin-top:6px;font-size:.95rem}
.post .stats{margin-top:6px;font-size:.78rem;color:var(--muted)}
.post.flag-ok{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 14%,var(--card))}
.post.flag-no{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,var(--card))}
.post .why{display:none;margin-top:8px;font-size:.86rem;border-top:2px dashed var(--line);padding-top:8px}
.post.done .why{display:block}

/* iceberg */
.berg{max-width:680px;margin-inline:auto;position:relative;border-radius:14px;overflow:hidden;border:2.5px solid var(--line);background:linear-gradient(#cfe8ff 0 30%,#1b3d8f 30% 100%)}
.berg svg{display:block;width:100%;height:auto}
.berg-hot{position:absolute;transform:translate(-50%,-50%);border:2.5px solid #14162B;border-radius:999px;background:#fff;color:#14162B;font-weight:700;font-size:.8rem;padding:5px 10px;white-space:nowrap;box-shadow:2px 2px 0 #14162B}
.berg-hot.open{background:var(--sun);color:#14162B}
.berg-hot.top{background:#FF5446;color:#fff}
.berg-out{max-width:680px;margin-inline:auto;margin-top:12px;min-height:64px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper);font-size:.95rem}

/* ecological sorter */
.eco{display:grid;grid-template-columns:1fr 1.1fr;gap:18px}
@media (max-width:820px){.eco{grid-template-columns:1fr}}
.pool{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.token{border:2px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--paper);font-size:.86rem;text-align:left;transition:transform .1s}
.token.sel{background:var(--sun);color:var(--sun-ink);transform:scale(1.04)}
.token.placed{opacity:.35;pointer-events:none}
.rings{position:relative;aspect-ratio:1;max-width:100%;width:min(100%,460px);margin-inline:auto}
.ring{position:absolute;border-radius:50%;border:2.5px solid var(--line);display:flex;justify-content:center;padding-top:6px;font-family:var(--f-display);font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ring:hover{filter:brightness(1.06)}
.eco-list{margin-top:10px;font-size:.86rem}
.eco-list b{font-family:var(--f-display);font-size:.74rem}

/* roles circle */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}
@media (max-width:820px){.roles{grid-template-columns:1fr}}
.roles svg{width:100%;max-width:440px;margin-inline:auto;display:block}
.roles svg g.role{cursor:pointer}
.roles svg g.role:hover circle,.roles svg g.role.on circle{stroke-width:5}
.role-info{border:2.5px solid var(--line);border-radius:14px;padding:16px;background:var(--paper);min-height:220px}
.role-info h4{font-size:1.1rem;margin-bottom:6px}

/* order game */
.order{display:flex;flex-direction:column;gap:8px;counter-reset:st}
.step{display:flex;align-items:center;gap:10px;border:2.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.step::before{counter-increment:st;content:counter(st);font-family:var(--f-display);font-weight:900;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none;font-size:.85rem}
.step span{flex:1;font-size:.94rem;min-width:0}
.step .mv{display:flex;gap:4px}
.step .mv button{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);background:var(--card);font-weight:900}
.step.good{background:color-mix(in srgb,var(--mint) 20%,var(--card))}
.step.bad{background:color-mix(in srgb,var(--coral) 18%,var(--card))}

/* simulator */
.sim{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}
@media (max-width:820px){.sim{grid-template-columns:1fr}}
.sim-scene{border:2.5px solid var(--line);border-radius:14px;padding:18px;background:var(--paper)}
.sim-scene .time{font-family:var(--f-display);font-weight:900;font-size:1.6rem;color:var(--coral)}
.sim-scene p{margin-top:8px;font-size:1rem}
.sim-opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.sim-opt{text-align:left;border:2.5px solid var(--line);border-radius:12px;padding:10px 13px;background:var(--card);font-size:.94rem;transition:transform .1s}
.sim-opt:hover{transform:translateX(4px);background:var(--sun);color:var(--sun-ink)}
.meters{display:flex;flex-direction:column;gap:14px}
.meter label{display:flex;justify-content:space-between;font-weight:700;font-size:.86rem}
.meter .bar>i{transition:width .5s}
.sim-log{font-size:.84rem;color:var(--muted);border-top:2px dashed var(--line);padding-top:10px;max-height:220px;overflow:auto}
.sim-log li{margin-bottom:5px}

/* message builder */
.builder{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field label{display:block;font-weight:700;font-size:.84rem;margin-bottom:4px}
.field select,.field input,.field textarea{width:100%;border:2.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--paper);color:var(--ink);font:inherit;font-size:.94rem}
.field textarea{min-height:90px;resize:vertical}
.output{margin-top:14px;border:2.5px solid var(--line);border-radius:14px;padding:16px;background:var(--sun);color:var(--sun-ink);font-family:var(--f-hand);font-size:1.3rem;line-height:1.35;position:relative}
.output.plain{font-family:var(--f-body);font-size:.95rem;background:var(--paper);color:var(--ink);white-space:pre-wrap}
.copyrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.copyrow small{color:var(--muted)}

/* evidence */
.ev{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:820px){.ev{grid-template-columns:repeat(2,1fr)}}
.evc{border:2.5px solid var(--line);border-radius:14px;padding:12px;background:var(--paper);text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px}
.evc .big{font-family:var(--f-display);font-weight:900;font-size:1.05rem}
.evc small{font-size:.82rem;color:var(--muted)}
.evc.on{background:var(--mint);color:#fff}
.evc.on small{color:#fff}
.evc.trap.on{background:var(--coral)}

/* radar */
.radar{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}
@media (max-width:820px){.radar{grid-template-columns:1fr}}
.sliders{display:flex;flex-direction:column;gap:10px}
.sl label{display:flex;justify-content:space-between;font-size:.88rem;font-weight:600;gap:8px}
.sl input{width:100%;accent-color:var(--cobalt)}
.radar svg{width:100%;max-width:420px;display:block;margin-inline:auto}
.reco{margin-top:12px;font-size:.92rem}

/* charter */
.charter{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.charter{grid-template-columns:1fr}}
.paper-sheet{border:2.5px solid var(--line);border-radius:6px;background:#FFFDF6;color:#14162B;padding:22px 22px 26px;box-shadow:6px 6px 0 var(--line);font-family:var(--f-hand);font-size:1.2rem;min-height:300px;background-image:repeating-linear-gradient(transparent 0 31px,#d8def0 31px 32px)}
.paper-sheet h4{font-family:var(--f-display);font-size:1rem;margin-bottom:10px;text-align:center}
.paper-sheet ol{padding-left:22px;margin:0;line-height:32px}
.paper-sheet .sig{margin-top:16px;font-size:1rem;opacity:.7}

/* quiz */
.quiz-q{font-weight:700;font-size:1.04rem;margin-bottom:10px}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.qopt{text-align:left;border:2.5px solid var(--line);border-radius:12px;padding:10px 13px;background:var(--paper);font-size:.95rem}
.qopt.ok{background:var(--mint);color:#fff}
.qopt.no{background:var(--coral);color:#fff}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}

/* tasks */
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.tasks{grid-template-columns:1fr}}
.task{border:3px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.task-top{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--line);flex-wrap:wrap}
.task.sync .task-top{background:var(--sun);color:var(--sun-ink)}
.task.async .task-top{background:var(--lilac);color:#fff}
.task-top h4{font-size:1rem;flex:1;min-width:180px}
.task-body{padding:16px 18px;display:flex;flex-direction:column;gap:10px;font-size:.94rem;flex:1}
.task-body ol,.task-body ul{margin:0;padding-left:20px}
.task-body li{margin-bottom:4px}
.deliv{border:2px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);font-size:.9rem}
.deliv b{font-family:var(--f-display);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:3px}
.check{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:6px;font-weight:700;font-size:.9rem}
.check input{width:22px;height:22px;accent-color:var(--mint)}
.rubric{width:100%;border-collapse:collapse;font-size:.84rem}
.rubric th,.rubric td{border:1.5px solid var(--soft);padding:6px 8px;text-align:left;vertical-align:top}
.rubric th{background:var(--soft);font-family:var(--f-display);font-size:.7rem;letter-spacing:.05em}
.tablewrap{overflow-x:auto}

/* video */
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.vid{border:3px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.vid-thumb{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--vc,var(--cobalt));display:grid;place-items:center;overflow:hidden;color:#fff;text-decoration:none;border-bottom:3px solid var(--line)}
.vid-thumb::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.22) 1.3px,transparent 1.5px);background-size:11px 11px}
.vid-thumb .play{position:relative;width:70px;height:70px;border-radius:50%;background:#fff;border:3px solid #14162B;display:grid;place-items:center;box-shadow:4px 4px 0 #14162B;transition:transform .15s}
.vid-thumb:hover .play{transform:scale(1.08) rotate(-4deg)}
.vid-thumb .play::after{content:"";border-left:22px solid #14162B;border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
.vid-thumb .src{position:absolute;left:10px;top:10px;background:#E62B1E;color:#fff;font-family:var(--f-display);font-weight:900;font-size:.7rem;padding:4px 8px;border-radius:6px;letter-spacing:.04em}
.vid-thumb .dur{position:absolute;right:10px;bottom:10px;background:#14162B;color:#fff;font-weight:700;font-size:.78rem;padding:3px 8px;border-radius:6px}
.vid-thumb .big-t{position:absolute;left:14px;bottom:12px;right:70px;font-family:var(--f-display);font-weight:900;font-size:1.05rem;line-height:1.15;text-align:left;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.vid iframe{width:100%;aspect-ratio:16/9;border:0;display:block;border-bottom:3px solid var(--line)}
.vid-body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.vid-body h4{font-size:.98rem}
.vid-body .by{font-size:.84rem;color:var(--muted)}
.vid-body details{border-top:2px dashed var(--soft);padding-top:8px;font-size:.9rem}
.vid-body summary{font-weight:700;cursor:pointer}
.vid-body ol{margin:6px 0 0;padding-left:18px}

/* cases */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.case{border:3px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.case-top{padding:16px 18px;background:var(--cc);color:#fff;border-bottom:3px solid var(--line)}
.case-top .eyebrow{color:#fff;opacity:.85}
.case-top h3{font-size:1.15rem;margin-top:4px}
.case-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;font-size:.94rem;flex:1}
.timeline{list-style:none;margin:0;padding:0;border-left:3px solid var(--line);display:flex;flex-direction:column;gap:8px}
.timeline li{padding-left:14px;position:relative;font-size:.9rem}
.timeline li::before{content:"";position:absolute;left:-9px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--cc);border:2.5px solid var(--line)}
.timeline b{font-family:var(--f-display);font-size:.72rem}
.case details{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.case details+details{margin-top:-4px}
.case summary{font-weight:700;cursor:pointer}
.case details ul,.case details ol{margin:8px 0 0;padding-left:20px}
.case .qs{margin:0;padding-left:20px}
.case .mods{display:flex;gap:6px;flex-wrap:wrap}

/* comic */
.comic-shell{border:3px solid var(--line);border-radius:22px;background:var(--card);box-shadow:8px 8px 0 var(--line);padding:clamp(14px,2.5vw,26px)}
.ep-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.comic{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:860px){.comic{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.comic{grid-template-columns:1fr}}
.panel{position:relative;border:3.5px solid #14162B;background:#fff;aspect-ratio:4/3.3;max-width:100%;overflow:hidden;border-radius:4px;animation:panelIn .5s ease both}
.panel.wide{grid-column:span 2}
@media (max-width:520px){.panel.wide{grid-column:auto}}
@keyframes panelIn{from{transform:scale(.94) rotate(-1deg);opacity:.3}to{transform:none;opacity:1}}
.panel svg{position:absolute;inset:0;width:100%;height:100%}
.cap{position:absolute;left:6px;top:6px;max-width:70%;background:#FFE36B;border:2.5px solid #14162B;padding:4px 8px;font-family:var(--f-hand);font-size:clamp(.82rem,1.6vw,1.02rem);line-height:1.15;color:#14162B;z-index:2}
.bub{position:absolute;background:#fff;border:2.5px solid #14162B;border-radius:18px;padding:6px 10px;font-family:var(--f-hand);font-size:clamp(.8rem,1.55vw,1rem);line-height:1.15;color:#14162B;max-width:56%;z-index:3}
.bub::after{content:"";position:absolute;bottom:-12px;left:var(--tx,20%);width:16px;height:14px;background:#fff;border-right:2.5px solid #14162B;border-bottom:2.5px solid #14162B;transform:skewX(-30deg) rotate(20deg);clip-path:polygon(0 0,100% 0,100% 100%)}
.bub.r::after{transform:skewX(30deg) rotate(-20deg);border-right:0;border-left:2.5px solid #14162B;clip-path:polygon(0 0,100% 0,0 100%)}
.bub.think{border-radius:50%;padding:10px 14px;border-style:dashed}
.bub.think::after{display:none}
.bub.shout{background:#FF5446;color:#fff;font-weight:700;border-radius:4px;transform:rotate(-2deg)}
.bub.shout::after{background:#FF5446}
.bub.phone{background:#D7F7C6;border-radius:8px}
.bub.phone::after{display:none}
.sfx{position:absolute;font-family:var(--f-display);font-weight:900;color:#FFC22E;-webkit-text-stroke:2px #14162B;font-size:clamp(1.3rem,3vw,2.1rem);transform:rotate(-8deg);z-index:2;letter-spacing:.02em}
.choice{margin-top:18px;border:3px dashed var(--line);border-radius:16px;padding:16px;background:var(--paper)}
.choice h4{font-size:1rem;margin-bottom:10px}
.choice-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:760px){.choice-opts{grid-template-columns:1fr}}
.debrief{margin-top:14px;border:2.5px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card);font-size:.95rem}
.debrief h5{font-family:var(--f-display);font-size:.9rem;margin:0 0 6px}

/* phone inside comic panel */
.pchat{position:absolute;left:18%;right:18%;top:6%;bottom:-8%;background:#0d0f1c;border:3px solid #14162B;border-radius:22px 22px 0 0;padding:7px 7px 0;z-index:1}
.pchat .phone-screen{height:100%;border-radius:15px 15px 0 0}
.pchat .phone-head{padding:6px 9px;font-size:clamp(.7rem,1.3vw,.84rem)}
.pchat .avatar{width:22px;height:22px;font-size:.66rem}
.pchat .chat{min-height:0;padding:7px;gap:5px}
.pchat .msg{font-size:clamp(.66rem,1.25vw,.8rem);padding:5px 8px;max-width:92%}
.pchat .msg b{font-size:.66rem}

/* theory */
.theory-bar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.theory{display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}
@media (max-width:860px){.theory{grid-template-columns:1fr}.toc{position:static!important}}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;gap:2px;border:2.5px solid var(--line);border-radius:14px;padding:12px;background:var(--card);font-size:.86rem;min-width:0}
.toc b{font-family:var(--f-display);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.toc a{color:var(--ink);text-decoration:none;padding:5px 8px;border-radius:8px}
.toc a:hover{background:var(--soft)}
.theory article{min-width:0;max-width:72ch}
.theory section{margin-bottom:30px}
.theory h3{font-size:1.2rem;margin-bottom:10px}
.theory p{margin-bottom:10px}
.theory ul{margin:0 0 12px;padding-left:22px}
.theory li{margin-bottom:6px}
.theory blockquote{margin:14px 0;border-left:6px solid var(--coral);background:var(--card);padding:12px 16px;border-radius:0 12px 12px 0;font-style:italic}
.theory blockquote cite{display:block;margin-top:6px;font-style:normal;font-size:.84rem;color:var(--muted)}
.biblio li{font-size:.9rem}
/* agenda */
.agenda{border:3px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow);padding:18px;margin-bottom:24px}
.ag-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.ag-head h3{font-size:1.15rem;margin-top:4px}
.ice{display:grid;grid-template-columns:1fr 200px;gap:16px;border:2.5px dashed var(--coral);border-radius:14px;padding:14px 16px;background:color-mix(in srgb,var(--coral) 9%,var(--card));margin-bottom:16px}
@media (max-width:640px){.ice{grid-template-columns:1fr}}
.ice .tag{font-family:var(--f-display);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;padding:4px 8px;border-radius:6px}
.ice h4{font-size:1.05rem;margin:8px 0 6px}
.ice ol{margin:0 0 8px;padding-left:20px;font-size:.93rem}
.ice p{font-size:.92rem}
.ice small{color:var(--muted)}
.ice-l{min-width:0}
.ice-t{display:flex;flex-direction:column;justify-content:center;gap:8px}
.timer{font-family:var(--f-display);font-weight:900;font-size:2.6rem;text-align:center;font-variant-numeric:tabular-nums;border:3px solid var(--line);border-radius:14px;background:var(--card);padding:6px}
.timer.low{color:var(--coral)}
.agtable{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px}
.agtable th{text-align:left;font-family:var(--f-display);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:8px;border-bottom:3px solid var(--line)}
.agtable td{padding:9px 8px;border-bottom:1.5px solid var(--soft);vertical-align:top}
.agtable td.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.kind{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;border:2px solid var(--line);white-space:nowrap}
.kind.kT{background:var(--card)}.kind.kP{background:var(--sun);color:var(--sun-ink)}.kind.kD{background:var(--coral);color:#fff}
.async-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.async-list li{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;border:2px solid var(--soft);border-radius:12px;padding:10px 12px;font-size:.92rem}
.async-list li .chip{grid-row:span 2;align-self:start;justify-self:start}
@media (max-width:560px){.async-list li{grid-template-columns:1fr}.async-list li .chip{grid-row:auto}}
/* forms */
.profile-card{border:3px solid var(--line);border-radius:16px;background:var(--card);padding:14px 16px;margin:0 0 18px;box-shadow:3px 3px 0 var(--line)}
.fisa .profile-card{box-shadow:none;border-width:2px;background:var(--paper)}
.pc-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pc-head .tag{font-family:var(--f-display);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;background:var(--cobalt);color:#fff;padding:4px 8px;border-radius:6px}
.pc-head small{color:var(--muted)}
.fform{display:flex;flex-direction:column;gap:18px}
.ff{min-width:0}
.flabel{display:block;font-weight:700;margin-bottom:6px}
.ff input[type=text],.ff input[type=number],.ff input:not([type]),.ff textarea,.ff select{width:100%;border:2.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--paper);color:var(--ink);font:inherit;font-size:.95rem}
.ff textarea{resize:vertical;line-height:1.45}
.wc{font-size:.8rem;color:var(--coral);margin-top:4px;font-weight:700}.wc.ok{color:var(--mint)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:.93rem;cursor:pointer}
.ck input{width:18px;height:18px;margin-top:3px;accent-color:var(--cobalt);flex:none}
.scale{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scale small{color:var(--muted);font-size:.8rem}
.sc input{position:absolute;opacity:0;pointer-events:none}
.sc span{display:grid;place-items:center;width:40px;height:40px;border:2.5px solid var(--line);border-radius:10px;font-weight:800;cursor:pointer;background:var(--paper)}
.sc input:checked+span{background:var(--cobalt);color:#fff}
.sc input:focus-visible+span{outline:3px solid var(--coral);outline-offset:2px}
.gtable{width:100%;border-collapse:collapse;min-width:620px}
.gtable th{text-align:left;font-size:.78rem;font-weight:800;padding:6px;background:var(--soft);border:1.5px solid var(--line)}
.gtable td{border:1.5px solid var(--line);padding:4px;vertical-align:top}
.gtable input,.gtable textarea,.gtable select{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:.9rem;padding:5px;border-radius:6px;resize:vertical}
.gtable input:focus,.gtable textarea:focus,.gtable select:focus{background:var(--paper);outline:2px solid var(--cobalt)}
.gtable .rm{width:30px;height:30px;border:2px solid var(--line);border-radius:8px;background:var(--card);font-weight:900}
.ff [data-addrow]{margin-top:8px}
.dlrow{margin-top:22px;padding-top:16px;border-top:3px dashed var(--soft)}
.fise-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.fcard{display:flex;flex-direction:column;gap:8px;border:3px solid var(--line);border-left:12px solid var(--mc);border-radius:16px;padding:16px;background:var(--card);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:transform .15s;min-width:0}
.fcard:hover{transform:translate(-2px,-2px)}
.fcard h3{font-size:1rem}
.fcard p{font-size:.88rem;color:var(--muted);flex:1}
.fcard small{font-weight:700;font-size:.8rem}
.fcard .bar>i{background:var(--mc)}
.pf-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:22px 0}
@media (max-width:760px){.pf-steps{grid-template-columns:1fr 1fr}}
.pf-steps div{border:2.5px solid var(--line);border-radius:12px;padding:10px;background:var(--card);font-weight:700;font-size:.88rem;display:flex;gap:8px;align-items:center}
.pf-steps b{font-family:var(--f-display);background:var(--ink);color:var(--paper);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;flex:none}
.pf-fise{display:flex;flex-direction:column;gap:8px}
.pf-row{display:flex;align-items:center;gap:10px;border:2px solid var(--soft);border-radius:12px;padding:8px 12px;flex-wrap:wrap}
.pf-row .ck{flex:1;min-width:220px}
.checklist{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px}
.checklist li{font-size:.92rem;color:var(--muted)}
.checklist li.ok{color:var(--mint);font-weight:700}

/* etică */
.modquote{position:relative;z-index:1;margin:16px 0 0;max-width:60ch;font-family:var(--f-hand);font-size:1.35rem;line-height:1.25;border-left:5px solid #fff;padding:4px 0 4px 14px}
.modquote cite{display:block;font-family:var(--f-body);font-style:normal;font-size:.8rem;opacity:.85;margin-top:4px}
.lem{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.lem-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lem-row b{min-width:130px}
.lem-opts{display:flex;gap:8px;flex-wrap:wrap}
.lem-o{border:2.5px solid var(--line);border-radius:10px;padding:7px 14px;background:var(--paper);font-weight:700}
.lem-o.on{background:var(--ink);color:var(--paper)}
.lem-o.ok{background:var(--mint);color:#fff}
.lem-o.no{background:var(--coral);color:#fff}
.dil-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dil-nav .tab{font-size:.8rem;padding:6px 10px}
.dil-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (max-width:640px){.dil-opts{grid-template-columns:1fr}}
.sim-opt.chosen{background:var(--ink);color:var(--paper)}
.cyc-switch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cyc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:center}
@media (max-width:820px){.cyc{grid-template-columns:1fr}}
.cyc-ring{position:relative;aspect-ratio:1;width:min(100%,480px);max-width:100%;margin-inline:auto;color:var(--cc)}
.cyc-arrow{position:absolute;inset:0;z-index:0;width:100%;height:100%;animation:spin 30s linear infinite;pointer-events:none}

2:[
 {h:"1. Bullyingul, un fenomen de grup", b:[

  ["**Individ**: temperament, impulsivitate, empatie, reglare emoțională, experiențe anterioare.","**Familie**: stil parental, violență în familie, supraveghere, modele de rezolvare a conflictelor.","**Grup de egali / clasă**: norme, ierarhii, prietenii, lideri informali.","**Școală**: climat, reguli, consecvența adulților, supraveghere, relația profesor–elev.","**Mediul online**: platforme, anonimat, algoritmi, cultura reacțiilor.","**Comunitate și societate**: modele media, toleranța la umilire, stereotipuri, prejudecăți."],

 {h:"3. Profiluri: cine agresează și cine e agresat", b:[

  ["**Agresorul dominant**: popular, cu abilități sociale bune, folosește bullyingul strategic pentru statut. Adesea e plăcut adulților.","**Agresorul-victimă** (bully-victim): a fost la rândul lui victimă, are dificultăți de reglare emoțională, reacționează impulsiv. Este profilul cu cel mai mare risc."],
  "**Elevii vizați** sunt adesea percepuți ca „diferiți”: nou-veniți, cu cerințe educaționale speciale, dintr-o minoritate, cu aspect fizic sau interese diferite, mai timizi sau fără prieteni apropiați. Diferența **nu** este cauza: cauza este alegerea agresorului și toleranța grupului.",

 {h:"4. Familia și școala", b:[
  ["Stilurile parentale **autoritar** (control prin pedeapsă, umilire) și **neglijent** (lipsa limitelor și a supravegherii) sunt asociate cu un risc crescut de comportament agresiv.","Copiii expuși violenței în familie pot reproduce modelul sau pot fi mai vulnerabili.","Lipsa regulilor digitale acasă: telefon în cameră toată noaptea, conturi fără setări de confidențialitate."],

  ["Zone fără supraveghere: vestiare, toalete, scări, curtea din spate, autobuzul școlar.","Reacții inconsecvente: același comportament e sancționat de un profesor și ignorat de altul.","Lipsa unui canal sigur de raportare."]

 {h:"6. Semnale de alarmă", b:[

3:[
 {h:"1. Principiile intervenției", b:[
  ["**Siguranța întâi**: oprești comportamentul și protejezi victima.","**Separă**: discuții individuale, niciodată victima și agresorul împreună la început.","**Nu blama victima**: „Ce ai făcut ca să te ia la țintă?” e o întrebare interzisă.","**Confidențialitate**: informația ajunge doar la cine trebuie.","**Documentare**: fapte, nu interpretări.","**Lucru în echipă**: diriginte, GAB, consilier, conducere, familie.","**Responsabilizare, nu umilire**: consecințe clare, oportunitate de reparare.","**Monitorizare**: intervenția nu se termină după o discuție."]

 {h:"2. Protocolul de intervenție", b:[
  ["**Pasul 1, pe loc**: oprești comportamentul calm și ferm. Numești comportamentul, nu persoana: „Filmarea se oprește acum.”","**Pasul 2**: scoți victima din situație, te asiguri că e bine, o asculți separat.","**Pasul 3**: documentezi: ce s-a întâmplat, cine, când, unde, martori, probe digitale.","**Pasul 4**: informezi dirigintele și Grupul de acțiune anti-bullying, conform procedurii școlii.","**Pasul 5**: discuți separat cu elevul (elevii) care au agresat.","**Pasul 6**: informezi familiile și implici consilierul școlar.","**Pasul 7**: plan de intervenție (măsuri pentru victimă, agresor, martori, clasă) și monitorizare la 1, 2 și 4 săptămâni."],
  "**Fișa de incident** conține: data și ora, locul, descrierea obiectivă, persoanele implicate, martorii, măsurile luate imediat, persoanele informate, semnătura. Nu conține diagnostice, etichete sau presupuneri."

 {h:"3. Discuția cu elevul agresat", b:[
  ["Alege un loc liniștit, privat, fără grabă.","Începe cu siguranța: „Sunt aici să te ajut. Ai făcut bine că ai vorbit.”","Ascultă fără să întrerupi, fără să minimizezi și fără să promiți secretul total: „Nu pot păstra secretul dacă ești în pericol, dar o să-ți spun ce fac și cu cine vorbesc.”","Validează: „Nu e vina ta.”","Stabiliți împreună un **plan de siguranță**: la cine merge, unde stă în pauze, cum raportează un nou episod.","Revino după 1–2 zile."],
  "**De evitat**: „Ignoră-i.”, „Ripostează.”, „Și tu ce le-ai făcut?”, „Fii mai puternic.”, „O să vă împăcați.”"

 {h:"4. Discuția cu elevul care a agresat", b:[
  ["Fermitate pe comportament, respect față de persoană.","Descrie faptele concrete, cu probe dacă există.","Nu cere confirmarea etichetei („recunoaște că ești agresor”), ci asumarea faptelor.","Explorează funcția comportamentului: ce câștigă, ce se întâmplă cu el.","Stabilește consecințele, conform regulamentului, și **repararea**."],
  "**Întrebările restaurative** ajută elevul să înțeleagă impactul:",

  "Alte abordări cunoscute: **Metoda preocupării comune** (Pikas), care lucrează individual cu fiecare membru al grupului care agresează, și **Grupul de sprijin** (Maines și Robinson), care implică elevi din clasă în susținerea victimei. Ambele cer formare și se aleg în funcție de caz."

 {h:"5. Comunicarea cu părinții", b:[
  ["Contact direct și individual, niciodată prin grupul părinților.","Fapte, nu etichete. Spune ce a făcut școala și ce va face.","Nu oferi informații despre celălalt copil.","Părintele victimei are nevoie de siguranță și de un plan; părintele elevului care a agresat are nevoie să nu se simtă atacat, ca să devină partener.","Stabilește următoarea întâlnire înainte de a încheia."]
 ]},
 {h:"6. Gestionarea cyberbullyingului", b:[
  ["**Nu răspunde**: răspunsul alimentează conflictul.","**Salvează probele**: capturi de ecran cu data, ora, numele contului și linkul. Nu șterge mesajele înainte de a le salva.","**Blochează** contul agresor.","**Raportează** pe platformă (hărțuire, uzurpare de identitate, conținut intim).","**Spune** unui adult de încredere."],
  "**Situații cu potențial penal**: amenințări, hărțuire persistentă, distribuirea de imagini intime, șantaj. Acestea se raportează imediat conducerii școlii și, după caz, poliției. Profesorul **nu** colectează și nu redistribuie conținut intim al unui minor, nici măcar ca probă: notează existența lui și anunță autoritățile.",
  "Pentru siguranță online și raportare, elevii și părinții pot apela la programul **Ora de Net** (Salvați Copiii România)."
 ]},
 {h:"7. Medierea și comunicarea nonviolentă", b:[
  "Medierea e potrivită pentru **conflictele între egali**, nu ca prim pas în bullying. Pașii unei medieri școlare:",
  ["Stabilirea regulilor (vorbim pe rând, fără insulte).","Fiecare parte își spune povestea, mediatorul reformulează.","Identificarea nevoilor din spatele pozițiilor.","Generarea de soluții împreună.","Alegerea unei soluții acceptate de ambele părți.","Acordul și verificarea ulterioară."],
  "**Comunicarea nonviolentă** (Marshall Rosenberg) are patru componente: **observație** (fapte), **sentiment**, **nevoie**, **cerere**. Mesajul „eu” aplică acest model: „Când văd [fapt], mă simt [emoție], pentru că [nevoie]. Îți cer [cerere concretă].”",
  "**Ascultarea activă**: contact vizual, reformulare („Deci tu spui că...”), întrebări deschise, numirea emoției („Pari furios.”)."
 ]}
],
4:[
 {h:"1. Abordarea la nivelul întregii școli", b:[
  "Programele cu cele mai bune rezultate lucrează simultan pe mai multe niveluri. Meta-analiza lui **Ttofi și Farrington** (2011) arată că programele școlare reduc în medie bullyingul cu aproximativ 20%, iar cele mai eficiente sunt intensive, de durată și implică părinții.",
  ["**Programul Olweus** (Norvegia): reguli la nivel de școală, supraveghere, discuții la clasă, intervenție individuală, implicarea părinților.","**KiVa** (Finlanda): lecții structurate, joc online pentru elevi, echipe KiVa în școală, accent pe **martori**."],
  "Elementul comun: **nu un erou, ci un sistem**. O activitate izolată, o dată pe an, nu schimbă climatul."
 ]},
 {h:"2. Climatul școlar și normele clasei", b:[
  ["Regulile se formulează **împreună** cu elevii și **pozitiv**: „Ne apărăm unii pe alții”, nu „Nu jigni”.","Puține reguli (5–8), afișate, reluate lunar.","Consecințe cunoscute dinainte, aplicate consecvent de toți adulții.","Ritualuri de apartenență: cercul de dimineață, check-in la ora de dirigenție, sărbătorirea reușitelor grupului."]

 {h:"3. Educația socio-emoțională", b:[
  "Modelul **CASEL** descrie cinci competențe socio-emoționale care pot fi predate și exersate:",
  ["**Autocunoaștere**: recunoașterea propriilor emoții și valori.","**Autoreglare**: gestionarea impulsurilor și a stresului.","**Conștiință socială**: empatie, respect pentru diversitate.","**Abilități relaționale**: comunicare, cooperare, rezolvarea conflictelor.","**Decizii responsabile**: alegeri etice și sigure."],
  "Ora de dirigenție e spațiul natural pentru aceste competențe, dar ele se pot integra în orice disciplină."
 ]},
 {h:"4. Martorii activi", b:[
  "Strategia celor **5D** oferă elevilor variante sigure de intervenție:",
  ["**Distrage**: întrerupi scena indirect.","**Delegă**: chemi un adult sau o persoană cu autoritate.","**Documentează**: salvezi probe, fără să le distribui.","**Direct**: spui clar că nu e ok, doar dacă e sigur.","**După**: verifici cum se simte victima și îi arăți că nu e singură."],
  "Elevii trebuie să învețe diferența dintre **a pârî** (vrei să-i faci rău cuiva) și **a raporta** (vrei să protejezi pe cineva). Școala trebuie să ofere și un canal **anonim**."
 ]},
 {h:"5. Cetățenia digitală", b:[
  ["Reguli scrise pentru grupul clasei: scop, moderatori, ce nu se postează.","Ateliere despre setări de confidențialitate și raportare pe platforme.","Regula „10 secunde”: te oprești înainte să postezi sau să distribui.","Discuții despre amprenta digitală și consimțământ (poze cu colegi).","Momente-cheie în calendar: **Ziua Siguranței pe Internet** (februarie) și **Ziua internațională împotriva violenței și bullyingului în școli, inclusiv cyberbullying** (UNESCO, prima joi din noiembrie)."]
 ]},
 {h:"6. Neticheta", b:[
  "**Neticheta** (de la „net” și „etichetă”) este ansamblul regulilor de bună purtare în comunicarea online. Nu e un regulament impus de platforme, ci un set de norme sociale pe care un grup le stabilește și le respectă. Pentru prevenirea cyberbullyingului contează pentru că transformă „ce e normal” în grupul online al clasei.",

function mountLegal(root){
  const body=root.querySelector(".app-body"), sc=root.querySelector("[data-score]");
  let i=0, pts=0;
  const DIMS=["Este legal?","Este etic?","Este moral?"], OPTS=["Da","Nu","Depinde"];
  function draw(){
    if(i>=LEM.length){
      body.innerHTML=`<p style="font-family:var(--f-display);font-weight:900;font-size:1.6rem">${pts}/${LEM.length*3}</p><p>${pts>=15?"Foarte bine. Distingi clar planul legal de cel etic și moral.":"Revezi situațiile în care legalul și eticul nu coincid: acolo se ascund cele mai multe cazuri de bullying."}</p><div class="note" style="margin-top:12px"><b>De reținut:</b> legea stabilește minimul. Etica profesională cere mai mult decât minimul.</div><div class="copyrow"><button class="btn small sun" data-re>Reia</button></div>`;
      body.querySelector("[data-re]").onclick=()=>{i=0;pts=0;draw();}; if(pts>=15) confetti(); return;
    }
    const s=LEM[i]; const pick=[null,null,null];
    body.innerHTML=`<p class="hint">Situația ${i+1} din ${LEM.length}. Răspunde pe fiecare plan, apoi verifică.</p><div class="sort-card"><p>${s.t}</p></div><div class="lem">${DIMS.map((d,k)=>`<div class="lem-row"><b>${d}</b><div class="lem-opts">${OPTS.map(o=>`<button class="lem-o" data-d="${k}" data-o="${o}">${o}</button>`).join("")}</div></div>`).join("")}</div><div class="copyrow"><button class="btn sun small" data-check disabled>Verifică</button></div><div class="feedback" data-fb></div>`;
    const ck=body.querySelector("[data-check]");
    $$(".lem-o",body).forEach(b=>b.onclick=()=>{ const k=+b.dataset.d; pick[k]=b.dataset.o; $$(`.lem-o[data-d="${k}"]`,body).forEach(x=>x.classList.toggle("on",x===b)); ck.disabled=pick.includes(null); });
    ck.onclick=()=>{
      let g=0; DIMS.forEach((_,k)=>{ const good=pick[k]===s.a[k]; if(good) g++; $$(`.lem-o[data-d="${k}"]`,body).forEach(x=>{ x.disabled=true; if(x.dataset.o===s.a[k]) x.classList.add("ok"); else if(x.dataset.o===pick[k]) x.classList.add("no"); }); });
      pts+=g; sc.textContent=`${pts}/${LEM.length*3}`; ck.hidden=true;
      const fb=body.querySelector("[data-fb]"); fb.className="feedback show "+(g===3?"ok":"no");
      fb.innerHTML=`<b>${g}/3.</b> Răspuns de referință: legal: ${s.a[0]} · etic: ${s.a[1]} · moral: ${s.a[2]}.<br>${s.e}<div class="copyrow"><button class="btn small" data-n>${i<LEM.length-1?"Următoarea →":"Rezultat"}</button></div>`;
      fb.querySelector("[data-n]").onclick=()=>{i++;draw();};
    };
  }
  sc.textContent=`0/${LEM.length*3}`; draw();
}

const xesc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function wRuns(text, rpr=""){
  const parts = String(text==null?"":text).split("**");
  return parts.map((seg,i)=>{
    if(!seg) return "";
    const bold = i%2===1 ? "<w:b/>" : "";
    const lines = seg.split("\n");
    return lines.map((ln,k)=>`<w:r><w:rPr>${bold}${rpr}</w:rPr>${k?'<w:br/>':''}<w:t xml:space="preserve">${xesc(ln)}</w:t></w:r>`).join("");
  }).join("");
}
function wP(text, style, opts={}){
  const ppr = `<w:pPr>${style?`<w:pStyle w:val="${style}"/>`:''}${opts.ind?`<w:ind w:left="${opts.ind}" w:hanging="${opts.hang||0}"/>`:''}${opts.align?`<w:jc w:val="${opts.align}"/>`:''}${opts.after!=null?`<w:spacing w:after="${opts.after}"/>`:''}</w:pPr>`;
  return `<w:p>${ppr}${wRuns(text, opts.rpr||"")}</w:p>`;
}
function wTable(head, rows, widths){
  const n = head ? head.length : (rows[0]||[]).length;
  const total = 9638;
  const ws = widths || Array(n).fill(Math.floor(total/n));
  const cell = (t,w,hd)=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${hd?'<w:shd w:val="clear" w:color="auto" w:fill="E3E7F4"/>':''}</w:tcPr>${String(t==null||t===""?(hd?"":"—"):t).split("\n").map(l=>wP(hd?`**${l}**`:l,"TableText")).join("")}</w:tc>`;
  const b = `<w:top w:val="single" w:sz="6" w:color="14162B"/><w:left w:val="single" w:sz="6" w:color="14162B"/><w:bottom w:val="single" w:sz="6" w:color="14162B"/><w:right w:val="single" w:sz="6" w:color="14162B"/><w:insideH w:val="single" w:sz="4" w:color="9AA0BF"/><w:insideV w:val="single" w:sz="4" w:color="9AA0BF"/>`;
  return `<w:tbl><w:tblPr><w:tblW w:w="${total}" w:type="dxa"/><w:tblBorders>${b}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="90" w:type="dxa"/><w:right w:w="90" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${ws.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>${head?`<w:tr><w:trPr><w:tblHeader/></w:trPr>${head.map((h,i)=>cell(h,ws[i],true)).join("")}</w:tr>`:''}${rows.map(r=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${r.map((c,i)=>cell(c,ws[i],false)).join("")}</w:tr>`).join("")}</w:tbl>${wP("","",{after:60})}`;
}
function blocksToXML(blocks){
  return blocks.map(b=>{
    switch(b.t){
      case "title": return wP(b.text,"Title",{align:b.center?"center":null});
      case "subtitle": return wP(b.text,"Subtitle",{align:b.center?"center":null});
      case "center": return wP(b.text,"",{align:"center",rpr:b.big?'<w:sz w:val="28"/>':''});
      case "h1": return wP(b.text,"Heading1");
      case "h2": return wP(b.text,"Heading2");
      case "label": return wP(`**${b.text}**`,"",{after:40});
      case "p": return wP(b.text,"");
      case "quote": return wP(b.text,"Quote");
      case "muted": return wP(b.text,"Muted");
      case "bullets": return b.items.map(it=>wP("•\t"+it,"",{ind:540,hang:270,after:60})).join("");
      case "table": return wTable(b.head,b.rows,b.widths);
      case "pb": return `<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;
      case "spacer": return wP("","",{after:b.h||600});
      default: return "";
    }
  }).join("");
}

async function saveFile(filename, blob){
  let dl = null;
  try{ if(window.claude && typeof window.claude.use==="function") dl = await window.claude.use("downloads"); }catch(e){ dl=null; }
  if(dl){
    try{ await dl.save({filename, data:blob}); toast("Fișierul Word a fost descărcat"); }
    catch(e){ const c=e&&e.code; toast(c==="declined"?"Descărcarea a fost anulată":c==="rate_limited"?"Așteaptă câteva secunde și încearcă din nou":"Descărcarea nu e disponibilă în această vizualizare"); }
    return;
  }
  try{
    const url = URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},1500); toast("Fișierul Word a fost descărcat");
  }catch(e){ toast("Browserul a blocat descărcarea"); }
}
async function downloadDocx(filename, blocks, btn){
  if(btn){ btn.disabled=true; btn.dataset.l=btn.innerHTML; btn.innerHTML="Se generează..."; }
  try{ const blob = await buildDocx(blocks); await saveFile(filename, blob); }
  catch(e){ toast(e.message==="nojszip"?"Generatorul Word nu s-a încărcat. Verifică conexiunea și reîncarcă pagina.":"Nu am putut genera fișierul"); }
  finally{ if(btn){ btn.disabled=false; btn.innerHTML=btn.dataset.l; } }
}

/* ================= MOTOR FORMULARE ================= */
function gridInit(f){ if(f.pre) return f.pre.map(r=>[...r]); return Array.from({length:f.rows||3},()=>f.cols.map(()=>"")); }
function formState(key, fields){
  const st = store.get(key,{});
  fields.forEach(f=>{ if(f.type==="grid" && !Array.isArray(st[f.id])) st[f.id]=gridInit(f); if(f.type==="checks" && !Array.isArray(st[f.id])) st[f.id]=[]; });
  return st;
}
function cellHTML(col, v, pfx, fid, r, c){
  const id=`${pfx}_${fid}_${r}_${c}`, a=`id="${id}" data-g="${fid}" data-r="${r}" data-c="${c}" aria-label="${xesc(col.h)}, rândul ${r+1}"`;
  if(col.type==="select") return `<select ${a}><option value=""></option>${col.opts.map(o=>`<option ${o===v?'selected':''}>${xesc(o)}</option>`).join("")}</select>`;
  if(col.type==="textarea") return `<textarea ${a} rows="2">${xesc(v)}</textarea>`;
  return `<input ${a} type="${col.type==="number"?"number":"text"}" value="${xesc(v)}">`;
}
function fieldHTML(f, st, pfx){
  const id=`${pfx}_${f.id}`, v=st[f.id];
  let inner="";
  switch(f.type){
    case "text": case "number": inner=`<input id="${id}" data-f="${f.id}" type="${f.type}" value="${xesc(v||"")}" placeholder="${xesc(f.ph||"")}">`; break;
    case "textarea": inner=`<textarea id="${id}" data-f="${f.id}" rows="${f.big?8:4}">${xesc(v||"")}</textarea>${f.minWords?`<div class="wc" data-wc="${f.id}"></div>`:''}`; break;
    case "select": inner=`<select id="${id}" data-f="${f.id}"><option value="">Alege...</option>${f.opts.map(o=>`<option ${o===v?'selected':''}>${xesc(o)}</option>`).join("")}</select>`; break;
    case "checks": inner=`<div class="checks">${f.opts.map((o,k)=>`<label class="ck"><input type="checkbox" id="${id}_${k}" data-ck="${f.id}" value="${xesc(o)}" ${(v||[]).includes(o)?'checked':''}> <span>${xesc(o)}</span></label>`).join("")}</div>`; break;
    case "scale": inner=`<div class="scale" role="radiogroup" aria-label="${xesc(f.label)}"><small>${f.lo||""}</small>${[1,2,3,4,5].map(k=>`<label class="sc"><input type="radio" name="${id}" id="${id}_${k}" data-sc="${f.id}" value="${k}" ${String(v)===String(k)?'checked':''}><span>${k}</span></label>`).join("")}<small>${f.hi||""}</small></div>`; break;
    case "grid": inner=`<div class="tablewrap"><table class="gtable"><thead><tr>${f.cols.map(c=>`<th>${xesc(c.h)}</th>`).join("")}${f.add?'<th aria-label="Acțiuni"></th>':''}</tr></thead><tbody>${(v||[]).map((row,r)=>`<tr>${f.cols.map((c,ci)=>`<td>${cellHTML(c,row[ci]||"",pfx,f.id,r,ci)}</td>`).join("")}${f.add?`<td><button class="rm" data-rm="${f.id}" data-r="${r}" aria-label="Șterge rândul">×</button></td>`:''}</tr>`).join("")}</tbody></table></div>${f.add?`<button class="btn small" data-addrow="${f.id}" type="button">+ Adaugă rând</button>`:''}`; break;
  }
  const lab = (f.type==="checks"||f.type==="scale"||f.type==="grid") ? `<div class="flabel">${xesc(f.label)}</div>` : `<label class="flabel" for="${id}">${xesc(f.label)}</label>`;
  return `<div class="ff" data-field="${f.id}">${lab}${inner}</div>`;
}
const filled = v => Array.isArray(v) ? (v.length && (Array.isArray(v[0]) ? v.some(r=>r.some((c,i)=>c && String(c).trim()!=="")) : true)) : (v!=null && String(v).trim()!=="");
function gridHasUserInput(f, v){ if(!Array.isArray(v)) return false; return v.some((r,ri)=>r.some((c,ci)=>{ const pre=f.pre&&f.pre[ri]?f.pre[ri][ci]:""; return c && String(c).trim()!=="" && c!==pre; })); }
function completion(fields, st){
  const done = fields.filter(f=> f.type==="grid" ? gridHasUserInput(f, st[f.id]) : filled(st[f.id])).length;
  return Math.round(done/fields.length*100);
}
const words = s => (String(s||"").trim().match(/\S+/g)||[]).length;

function mountForm(root, key, fields, pfx, onChange){
  const st = formState(key, fields);
  const body = root.querySelector("[data-fields]");
  const draw = () => { body.innerHTML = fields.map(f=>fieldHTML(f,st,pfx)).join(""); wc(); };
  const save = () => { store.set(key, st); onChange && onChange(st); };
  const wc = () => fields.filter(f=>f.minWords).forEach(f=>{ const el=body.querySelector(`[data-wc="${f.id}"]`); if(el){ const n=words(st[f.id]); el.textContent=`${n} cuvinte${n<f.minWords?` · minimum ${f.minWords}`:" ✓"}`; el.classList.toggle("ok",n>=f.minWords);} });
  body.addEventListener("input", e=>{
    const t=e.target;
    if(t.dataset.f){ st[t.dataset.f]=t.value; wc(); }
    else if(t.dataset.g){ st[t.dataset.g][+t.dataset.r][+t.dataset.c]=t.value; }
    else if(t.dataset.ck){ st[t.dataset.ck]=$$(`[data-ck="${t.dataset.ck}"]`,body).filter(x=>x.checked).map(x=>x.value); }
    else if(t.dataset.sc){ st[t.dataset.sc]=t.value; }
    else return;
    save();
  });
  body.addEventListener("click", e=>{
    const add=e.target.closest("[data-addrow]"), rm=e.target.closest("[data-rm]");
    if(add){ const f=fields.find(x=>x.id===add.dataset.addrow); st[f.id].push(f.cols.map(()=>"")); save(); draw(); }
    if(rm){ const id=rm.dataset.rm; if(st[id].length>1){ st[id].splice(+rm.dataset.r,1); save(); draw(); } }
  });
  draw(); onChange && onChange(st);
  return { state: st, reset(){ Object.keys(st).forEach(k=>delete st[k]); Object.assign(st, formState("__none__", fields)); save(); draw(); } };
}
const raw = s => String(s==null?"":s).replace(/\*\*/g,"*\u200b*");
function formBlocks(fields, st){
  const out=[];
  fields.forEach(f=>{
    const v=st[f.id];
    if(f.type==="grid"){ out.push({t:"label",text:f.label}); out.push({t:"table", head:f.cols.map(c=>c.h), rows:(v||[]).map(r=>f.cols.map((c,i)=>raw(r[i]||"")))}); return; }
    out.push({t:"label",text:f.label});
    if(f.type==="checks") out.push({t:"p",text:f.opts.map(o=>((v||[]).includes(o)?"☒ ":"☐ ")+o).join("\n")});
    else if(f.type==="scale") out.push({t:"p",text: v?`${v} / 5  (1 = ${f.lo}, 5 = ${f.hi})`:"—"});
    else out.push({t:"p",text: v && String(v).trim() ? raw(v) : "—"});
  });
  return out;
}

function mountTimers(scope){
  $$(".ice-t",scope).forEach(box=>{
    const el=box.querySelector("[data-timer]"), total=+el.dataset.timer; let left=total, h=null;
    const show=()=>{ el.textContent=`${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`; el.classList.toggle("low",left<=60); };
    const start=box.querySelector("[data-tstart]");
    start.onclick=()=>{ if(h){ clearInterval(h); h=null; start.textContent="Continuă"; return; } start.textContent="Pauză"; h=setInterval(()=>{ if(!document.body.contains(el)){clearInterval(h);return;} left--; show(); if(left<=0){ clearInterval(h); h=null; start.textContent="Pornește"; left=total; toast("Timpul pentru dezgheț s-a terminat"); show(); } },1000); };
    box.querySelector("[data-treset]").onclick=()=>{ clearInterval(h); h=null; left=total; start.textContent="Pornește"; show(); };
  });
}

const $ = (s, r=document) => r.querySelector(s);

const store = {

  set(k, v){ try{ localStorage.setItem("zs_"+k, JSON.stringify(v)); }catch(e){} }
};
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const RO_DAYS = ["duminică","luni","marți","miercuri","joi","vineri","sâmbătă"];
const RO_MON = ["ian.","feb.","mar.","apr.","mai","iun.","iul.","aug.","sept.","oct.","nov.","dec."];
const fmtD = s => { const d=new Date(s+"T12:00:00"); return {day:d.getDate()+" "+RO_MON[d.getMonth()], dow:RO_DAYS[d.getDay()]}; };

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
function copyText(text, btn){
  const done = () => toast("Copiat în clipboard");
  try{
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackSelect(btn));
  }catch(e){ fallbackSelect(btn); }
}
function fallbackSelect(btn){
  const box = btn && btn.closest(".app-body") && btn.closest(".app-body").querySelector(".output");
  if(box){ const r=document.createRange(); r.selectNodeContents(box); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Textul e selectat: apasă Ctrl+C"); }
}
function confetti(){
  if(REDUCED) return;
  const cv=$("#confetti"), ctx=cv.getContext("2d");
  cv.width=innerWidth; cv.height=innerHeight;
  const cols=["#2743F5","#FF5446","#FFC22E","#12A884","#8B6CFF"];
  const ps=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:Math.random()*-14-4,r:Math.random()*7+4,c:cols[Math.floor(Math.random()*5)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.vx*=.99;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore();});
    if(++f<120) requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* M1 — Conflict sau bullying */
function mountSorter(root){
  const items = shuffle(SORT_ITEMS); let i=0, ok=0; const res=[];
  const body = root.querySelector(".app-body");
  const sc = root.querySelector("[data-score]");
  function draw(){
    if(i>=items.length){
      body.innerHTML = `<div class="sort-card"><div class="who">Rezultat</div><p style="font-size:1.3rem;font-family:var(--f-display);font-weight:900">${ok} din ${items.length}</p><p>${ok>=8?"Excelent. Ai un ochi format pentru diferența dintre conflict și bullying.":ok>=5?"Bine. Revezi situațiile ambigue: repetiția și dezechilibrul de putere fac diferența.":"Reia exercițiul după ce citești „Idei-cheie”."}</p></div><div class="copyrow"><button class="btn small sun" data-re>Joacă din nou</button></div>`;
      body.querySelector("[data-re]").onclick=()=>{mountSorter(root);};
      if(ok>=8) confetti();
      return;
    }
    const it = items[i];
    body.innerHTML = `<p class="hint">Citește situația și decide. Atenție la cele trei criterii: intenție, repetiție, putere.</p><div class="sorter"><div class="sort-card"><div class="who">${it.who} · situația ${i+1}/${items.length}</div><p>${it.t}</p></div><div class="sort-btns"><button class="btn" data-a="conflict">🤝 Conflict</button><button class="btn coral" data-a="bullying">🎯 Bullying</button><button class="btn ink" data-a="cyber">📱 Cyberbullying</button></div><div class="feedback" data-fb></div><div class="dots">${items.map((_,k)=>`<i class="${res[k]===true?'ok':res[k]===false?'no':''}"></i>`).join("")}</div></div>`;
    $$("[data-a]",body).forEach(b=>b.onclick=()=>{
      const good = b.dataset.a===it.a; res[i]=good; if(good) ok++;
      const fb = body.querySelector("[data-fb]");
      fb.className = "feedback show " + (good?"ok":"no");
      fb.innerHTML = (good?"<b>Corect.</b> ":"<b>Nu chiar.</b> ") + it.why + `<div class="copyrow"><button class="btn small" data-next>Următoarea →</button></div>`;
      $$("[data-a]",body).forEach(x=>x.disabled=true);

    body.innerHTML=`<div class="sim"><div class="sim-scene"><div class="time">${n.time}</div><p>${n.t}</p><div class="sim-opts">${shuffle(n.o.map((o,k)=>({...o,k}))).map(o=>`<button class="sim-opt" data-o="${o.k}">${o.t}</button>`).join("")}</div></div>${meters()}</div>`;

}

function mountRadar(root){
  const body=root.querySelector(".app-body");
  const vals = store.get("radar",[3,2,4,2,3,3,2,2]);
  body.innerHTML=`<p class="hint">Evaluează o clasă reală pe o scară de la 1 (foarte slab) la 5 (foarte bun). Radarul și recomandările se actualizează pe loc. Valorile inițiale sunt un exemplu.</p><div class="radar"><div class="sliders">${RADAR_DIM.map((d,k)=>`<div class="sl"><label for="rd${k}"><span>${d.l}</span><span class="score" data-v="${k}">${vals[k]}</span></label><input type="range" min="1" max="5" step="1" id="rd${k}" value="${vals[k]}"></div>`).join("")}</div><div><svg viewBox="0 0 420 420" data-svg role="img" aria-label="Radarul climatului școlar"></svg></div></div><div class="reco" data-reco></div>`;
  const svg=body.querySelector("[data-svg]"), reco=body.querySelector("[data-reco]");
  function draw(){
    const cx=210,cy=210,R=140,n=RADAR_DIM.length;
    const pt=(k,v)=>{const a=-Math.PI/2+k/n*Math.PI*2;return [cx+Math.cos(a)*R*v/5, cy+Math.sin(a)*R*v/5];};
    let s="";
    for(let lv=1;lv<=5;lv++){ s+=`<polygon points="${RADAR_DIM.map((_,k)=>pt(k,lv).join(",")).join(" ")}" fill="none" stroke="var(--soft)" stroke-width="${lv===5?2.5:1.5}"/>`; }
    RADAR_DIM.forEach((d,k)=>{const [x,y]=pt(k,5);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--soft)" stroke-width="1.5"/>`;
      const [lx,ly]=pt(k,6.15); const words=d.l.split(" "); const half=Math.ceil(words.length/2);
      const anchor = Math.abs(lx-cx)<10?"middle":(lx>cx?"start":"end");
      s+=`<text x="${lx}" y="${ly-6}" text-anchor="${anchor}" font-size="11.5" font-weight="600" fill="var(--muted)" font-family="Onest,sans-serif"><tspan x="${lx}">${words.slice(0,half).join(" ")}</tspan><tspan x="${lx}" dy="13">${words.slice(half).join(" ")}</tspan></text>`;});
    s+=`<polygon points="${vals.map((v,k)=>pt(k,v).join(",")).join(" ")}" fill="color-mix(in srgb, var(--cobalt) 30%, transparent)" stroke="var(--cobalt)" stroke-width="3" stroke-linejoin="round"/>`;
    vals.forEach((v,k)=>{const [x,y]=pt(k,v);s+=`<circle cx="${x}" cy="${y}" r="5.5" fill="${v<=2?'var(--coral)':'var(--cobalt)'}" stroke="var(--line)" stroke-width="2"/>`;});
    svg.setAttribute("viewBox","-40 -10 500 440"); svg.innerHTML=s;
    const weak = vals.map((v,k)=>({v,k})).sort((a,b)=>a.v-b.v).slice(0,3).filter(x=>x.v<=3);
    const avg=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
    reco.innerHTML = `<div class="note"><b>Media climatului: ${avg}/5.</b> ${weak.length?`Priorități: <ul style="margin:6px 0 0;padding-left:20px">${weak.map(w=>`<li><b>${RADAR_DIM[w.k].l}</b> (${w.v}/5): ${RADAR_DIM[w.k].r}</li>`).join("")}</ul>`:"Toate dimensiunile sunt peste 3. Mențineți și monitorizați lunar."}</div>`;
    store.set("radar",vals);
  }
  $$("input[type=range]",body).forEach((r,k)=>r.oninput=()=>{vals[k]=+r.value; body.querySelector(`[data-v="${k}"]`).textContent=r.value; draw();});
  draw();
}

function mountQuiz(root, n){
  const body=root.querySelector(".app-body"), sc=root.querySelector("[data-score]");
  const qs=QUIZ[n]; let i=0, ok=0;
  const best=store.get(`q${n}`,null); if(best!==null) sc.textContent=`Cel mai bun scor: ${best}/${qs.length}`;
  function draw(){
    if(i>=qs.length){
      const prev=store.get(`q${n}`,0); store.set(`q${n}`,Math.max(prev,ok));
      body.innerHTML=`<p style="font-family:var(--f-display);font-weight:900;font-size:2rem">${ok}/${qs.length}</p><p>${ok===qs.length?"Perfect! Ești gata pentru modulul următor.":ok>=3?"Bine. Revezi explicațiile la întrebările greșite.":"Recitește ideile-cheie și reia testul."}</p><div class="copyrow"><button class="btn small sun" data-re>Reia testul</button></div>`;
      body.querySelector("[data-re]").onclick=()=>{i=0;ok=0;draw();};
      sc.textContent=`Cel mai bun scor: ${Math.max(prev,ok)}/${qs.length}`;
      if(ok===qs.length) confetti(); renderModCardBars(); return;
    }
    const q=qs[i];
    body.innerHTML=`<div class="eyebrow" style="margin-bottom:6px">Întrebarea ${i+1} din ${qs.length}</div><p class="quiz-q">${q.q}</p><div class="quiz-opts">${q.o.map((o,k)=>`<button class="qopt" data-k="${k}">${o}</button>`).join("")}</div><div class="feedback" data-fb style="margin-top:10px"></div>`;
    $$(".qopt",body).forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k; const good=k===q.a; if(good) ok++;
      $$(".qopt",body).forEach((x,j)=>{x.disabled=true; if(j===q.a) x.classList.add("ok"); else if(j===k) x.classList.add("no");});
      const fb=body.querySelector("[data-fb]"); fb.className="feedback show "+(good?"ok":"no");
      fb.innerHTML=`${good?"<b>Corect.</b>":"<b>Răspunsul corect e marcat cu verde.</b>"} ${q.e}<div class="copyrow"><button class="btn small" data-n>${i<qs.length-1?"Următoarea →":"Vezi rezultatul"}</button></div>`;
      fb.querySelector("[data-n]").onclick=()=>{i++;draw();};
    });
  }
  draw();
}

function heroChat(){
  const box=$("[data-herochat]"); if(!box) return;
  const seq=[
    {f:"Radu",t:"📷 [poză] cine doarme la română? 😂",bad:1,r:"😂 14"},
    {f:"Bia",t:"hahaha Frumoasa Adormită 💤",bad:1},
    {f:"Ioana",t:"😂😂"},
    {f:"Mihai",t:"Hai, gata. Nu e amuzant, șterge-o."},
    {sys:1,t:"Prof. Marin s-a alăturat conversației"},
    {f:"Prof. Marin",t:"Radu, te rog să ștergi poza. Vorbim mâine după prima oră."}
  ];
  let k=0;
  const add=()=>{ if(!document.body.contains(box)) return; if(k>=seq.length){ setTimeout(()=>{ if(!document.body.contains(box)) return; box.innerHTML="";k=0;add();},5000); return; }
    const m=seq[k++]; const d=document.createElement("div"); d.className=`msg ${m.sys?'sys':''} ${m.bad?'bad':''} ${m.f==="Mihai"||m.f==="Prof. Marin"?'me':''}`; d.innerHTML=(m.sys?'':`<b>${m.f}</b>`)+m.t+(m.r?`<br><span class="react">${m.r}</span>`:''); box.appendChild(d);
    setTimeout(add, REDUCED?400:1500); };
  if(REDUCED){ seq.forEach(()=>{}); }
  add();
}
function renderModCardBars(){ $$("[data-modbar]").forEach(i=>{ i.style.width=modProgress(+i.dataset.modbar)+"%"; }); }

  if(n===4) labs = appFrame("Diagnoză","Radarul climatului școlar","",'',"lab-radar") + appFrame("Cerc","Cercul clasei: vicios sau virtuos","",'',"lab-cyc") + appFrame("Generator","Campania școlii tale","",'',"lab-camp") + appFrame("Atelier","Regulile clasei noastre","",'',"lab-charter") + appFrame("Netichetă","Neticheta în grupul clasei","",'',"lab-net");

    <div class="sessions">${ss.map(s=>{const d=fmtD(s.d);return `<div class="sess"><b>${d.dow}, ${d.day}</b><br>${s.h} · ${s.ore} ore · online ${s.f}</div>`;}).join("")}</div>
  </section>
  <div class="tabs" role="tablist" data-mtabs>
    <button class="tab" role="tab" aria-selected="true" data-t="idei">Idei-cheie</button>
    <button class="tab" role="tab" aria-selected="false" data-t="teorie">Suport teoretic</button>
    <button class="tab" role="tab" aria-selected="false" data-t="agenda">Ce prezint · agenda</button>
    <button class="tab" role="tab" aria-selected="false" data-t="lab">Laborator interactiv</button>
    <button class="tab" role="tab" aria-selected="false" data-t="fise">Fișe de lucru</button>
    <button class="tab" role="tab" aria-selected="false" data-t="banda">Banda desenată</button>
    <button class="tab" role="tab" aria-selected="false" data-t="resurse">Video și cazuri</button>
    <button class="tab" role="tab" aria-selected="false" data-t="teme">Teme</button>
    <button class="tab" role="tab" aria-selected="false" data-t="test">Test</button>
  </div>
  <div data-pane="idei"><div class="ideas">${m.ideas.map(i=>`<div class="idea"><span class="k">${i.k}</span><h4>${i.h}</h4>${i.body}</div>`).join("")}</div>
    <div class="copyrow" style="margin-top:20px"><button class="btn sun" data-goto="teorie">Citește suportul teoretic →</button><button class="btn" data-goto="agenda">Vezi agenda sesiunilor</button></div></div>

  <div class="copyrow" style="margin-top:34px;justify-content:space-between">${n>1?`<a class="btn" href="#m${n-1}">← Modulul ${n-1}</a>`:'<span></span>'}${n<4?`<a class="btn ink" href="#m${n+1}">Modulul ${n+1} →</a>`:`<a class="btn ink" href="#teme">Toate temele →</a>`}</div>`;

function mountModule(n){
  const v=$("#app");
  const tabs=$$("[data-mtabs] .tab",v);
  const show=t=>{ tabs.forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t)); $$("[data-pane]",v).forEach(p=>p.hidden=p.dataset.pane!==t); store.set("tab"+n,t); };
  tabs.forEach(b=>b.onclick=()=>show(b.dataset.t));
  $$("[data-goto]",v).forEach(b=>b.onclick=()=>{show(b.dataset.goto); $("[data-mtabs]").scrollIntoView({behavior:REDUCED?"auto":"smooth"});});
  const ep=EPISODES.findIndex(e=>e.m===n);
  mountComic($("[data-comic]",v), ep>=0?ep:2);
  if(n===1){ mountSorter($("#lab-sorter")); mountFlips($("#lab-forms")); mountFeed($("#lab-feed")); mountLegal($("#lab-lem")); }
  if(n===2){ mountRoles($("#lab-roles")); mountBerg($("#lab-berg")); mountEco($("#lab-eco")); }
  if(n===3){ mountSim($("#lab-sim")); mountOrder($("#lab-order")); mountEvidence($("#lab-ev")); mountIMsg($("#lab-imsg")); mountDilemmas($("#lab-dil")); }
  if(n===4){ mountRadar($("#lab-radar")); mountCycle($("#lab-cyc")); mountCampaign($("#lab-camp")); mountCharter($("#lab-charter")); mountNet($("#lab-net")); }
  mountQuiz($("#lab-quiz"), n);
  bindTasks(v);
  FISE.filter(f=>f.m===n).forEach(fs=>mountFisa($("#fs-"+fs.id), fs));
  mountTimers(v);
  $("[data-dltheory]",v).onclick=(e)=>downloadDocx(`Suport_curs_Modulul_${n}.docx`, theoryBlocks(n), e.currentTarget);
  $$("[data-toc]",v).forEach(a=>a.onclick=(e)=>{ e.preventDefault(); const s=$(`[data-sec="${a.dataset.toc}"]`,v); s&&s.scrollIntoView({behavior:REDUCED?"auto":"smooth"}); });
  show(store.get("tab"+n,"idei"));
}

  return `<div class="section-head" style="margin-top:0"><div><p class="eyebrow">Bandă desenată interactivă</p><h2>Clasa a IX-a B</h2></div><p>Trei episoade, un singur grup de elevi. La finalul fiecărui episod, tu alegi ce urmează. Folosește episoadele la curs ca punct de pornire pentru discuții sau la ora de dirigenție, cu elevii.</p></div><div data-comic></div>

function renderCalendar(){
  const today=new Date(); today.setHours(0,0,0,0);
  const nextIdx = SESSIONS.findIndex(s=>new Date(s.d+"T00:00:00")>=today);
  return `<div class="section-head" style="margin-top:0"><div><p class="eyebrow">Calendar · Seria 1, Grupa 1</p><h2>${COURSE.period}</h2></div><p>${COURSE.seats} cursanți înscriși · formator: ${COURSE.trainer} · furnizor: ${COURSE.provider}.</p></div>
  <div class="cal">${SESSIONS.map((s,k)=>{const d=fmtD(s.d); const m=s.m?MODULES[s.m-1]:null; const past=new Date(s.d+"T00:00:00")<today;
    return `<div class="cal-row ${past?'past':''} ${k===nextIdx?'next':''}"><div class="d">${d.day}<small>${d.dow}${k===nextIdx?' · următoarea':''}</small></div><div class="what">${m?`<b><span class="mod-dot" style="background:${m.color}"></span>M${m.n} · ${m.title}</b>${s.h} · ${s.ore} ore${s.t?` · ${s.t}h teorie`:''} · ${s.p}h practică`:`<b><span class="mod-dot" style="background:var(--sun)"></span>Evaluare finală</b>Comisia de evaluare finală · online`}</div><span class="badge" style="background:${s.f==='sincron'?'var(--sun)':s.f==='asincron'?'var(--lilac)':'var(--coral)'};color:${s.f==='sincron'?'var(--sun-ink)':'#fff'}">${s.f}</span></div>`;}).join("")}</div>`;
}

/* ================= RUTARE ================= */
const ROUTES = ["acasa","m1","m2","m3","m4","banda","cazuri","video","teme","fise","portofoliu","calendar"];
function route(){
  let h=(location.hash||"#acasa").slice(1);
  let caseTarget=null, fisaId=null;
  if(/^c\d$/.test(h)){ caseTarget=h; h="cazuri"; }
  if(/^fisa-f\d\d$/.test(h)){ fisaId=h.slice(5); h="fise"; }
  if(!ROUTES.includes(h)) h="acasa";
  const app=$("#app");
  let html="";
  if(h==="acasa") html=renderHome();
  else if(/^m\d$/.test(h)) html=renderModule(+h[1]);
  else if(h==="banda") html=renderComicPage();
  else if(h==="cazuri") html=renderCases();
  else if(h==="video") html=renderVideos();
  else if(h==="teme") html=renderTasks();
  else if(h==="calendar") html=renderCalendar();
  else if(h==="fise") html=fisaId?renderFisaSingle(fisaId):renderFisePage();
  else if(h==="portofoliu") html=renderPortfolio();
  app.innerHTML = `<div class="view active">${html}<footer class="foot"><span>${COURSE.name} · ${COURSE.provider}</span><span>Formator: ${COURSE.trainer}</span></footer></div>`;
  $$("#nav a").forEach(a=>a.setAttribute("aria-current", a.getAttribute("href")==="#"+h ? "page" : "false"));
  const cur=$(`#nav a[href="#${h}"]`); if(cur) cur.scrollIntoView({inline:"center",block:"nearest"});
  if(h==="acasa"){ heroChat(); renderModCardBars(); }
  if(/^m\d$/.test(h)) mountModule(+h[1]);
  if(h==="banda") mountComic($("[data-comic]"),0);
  if(h==="teme") bindTasks(app);
  if(h==="fise"){ if(fisaId){ const fs=FISE.find(x=>x.id===fisaId); if(fs) mountFisa($("#fs-"+fs.id),fs); else bindProfile(app); } else bindProfile(app); }
  if(h==="portofoliu") mountPortfolio();
  window.scrollTo(0,0);
  if(caseTarget){ const el=document.getElementById(caseTarget); if(el) el.scrollIntoView(); }
}
addEventListener("hashchange", route);
updatePill();
route();
